name: Hourly Odoo & Zoho Sales Executive Lead Generator

on:
  schedule:
    - cron: '0 * * * *' # Runs every 1 hour
  workflow_dispatch:

jobs:
  run-lead-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth

      - name: Authenticate GCP Service Account
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > sheet-sync-504707-85df40232946.json

      - name: Execute Odoo & Zoho Lead Generators
        run: |
          python run_all_lead_generators.py

      - name: Clean Credentials
        if: always()
        run: |
          rm -f sheet-sync-504707-85df40232946.json
